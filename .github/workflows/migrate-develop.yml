name: Migrate Develop Database

on:
  push:
    branches:
      - develop
    paths:
      - "src/migrations/**"

  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run (e.g. post-weekly-reset)"
        required: false
        default: "Manual trigger"

permissions:
  contents: read

jobs:
  migrate-develop:
    name: Apply migrations to develop_testing
    runs-on: ubuntu-latest

    concurrency:
      group: develop-database-migrations
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Show pending migrations
        env:
          DATABASE_URL: ${{ secrets.DEVELOP_DATABASE_URL }}
        run: npm run db:status

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DEVELOP_DATABASE_URL }}
        run: npm run db:migrate

      - name: Confirm migrations applied
        env:
          DATABASE_URL: ${{ secrets.DEVELOP_DATABASE_URL }}
        run: npm run db:status